substitutions:
  device_prefix: kitchen-cupboard-light
  device_name: "Kitchen Cupboard Light"
  device_description: "H801 Connected to the cupboard lights and a button"
  device_ip: !secret kitchen_cupboard_light_ip
  device_ota: !secret kitchen_cupboard_light_ota
  device_key: !secret kitchen_cupboard_light_key

  device_button_1: "Button"


#region General Config
esphome:
  name: ${device_prefix}
  comment: "${device_description}"
  friendly_name: ${device_name}

logger:

api:
  encryption:
    key: ${device_key}

ota:
  - platform: esphome
    password: ${device_ota}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  post_connect_roaming: false
  manual_ip:
    static_ip: ${device_ip}
    gateway: 172.16.16.1
    subnet: 255.255.252.0
  ap:
    ssid: "${device_name} AP"
    password: ${device_ota}

captive_portal:
#endregion

#Device
esp8266:
  board: esp01_1m

#IO
output:
  - platform: esp8266_pwm
    pin: 12
    frequency: 1000 Hz
    id: pwm_b
  - platform: esp8266_pwm
    pin: 13
    frequency: 1000 Hz
    id: pwm_g
  - platform: esp8266_pwm
    pin: 15
    frequency: 1000 Hz
    id: pwm_r
  - platform: esp8266_pwm
    pin: 14
    frequency: 1000 Hz
    id: pwm_w1
  - platform: esp8266_pwm
    pin: 4
    frequency: 1000 Hz
    id: pwm_w2

light:
  - platform: cwww
    id: cupboard_light_sink
    name: "Sink"
    cold_white: pwm_w1
    warm_white: pwm_w2
    cold_white_color_temperature: 6536 K
    warm_white_color_temperature: 2000 K
    constant_brightness: true

  - platform: cwww
    id: cupboard_light_cooktop
    name: "Cooktop"
    cold_white: pwm_r
    warm_white: pwm_g
    cold_white_color_temperature: 6536 K
    warm_white_color_temperature: 2000 K
    constant_brightness: true

binary_sensor:
  - platform: gpio
    name: "${device_button_1} State"
    pin: 
      number: GPIO3
      mode: INPUT
    id: raw_cupboard_button
    # internal: true
    filters:
      - delayed_on_off: 10ms
    on_multi_click:
      - timing:
          - ON for at most 350ms
          - OFF for at least 250ms
        then:
          - logger.log: "${device_button_1}: Click"
          - lambda: |-
              if(id(operating_mode).current_option() == std::string("Decoupled")) return;
              auto call_sink = id(cupboard_light_sink).toggle();
              call_sink.perform();
              auto call_cooktop = id(cupboard_light_cooktop).toggle();
              call_cooktop.perform();
          - lambda: |-
              id(button_event).trigger("click");
      - timing:
          - ON for at most 350ms
          - OFF for at most 250ms
          - ON for at most 350ms
          - OFF for at least 250ms
        then:
          - logger.log: "${device_button_1}: Double Click"
          - lambda: |-
              id(button_event).trigger("double_click");
      - timing:
          - ON for at least 1s
        then:
          - logger.log: "${device_button_1}: Hold"
          - lambda: |-
              id(button_event).trigger("hold");

    on_release:
        then:
          - logger.log: "${device_button_1}: Release"
          - lambda: |-
              id(button_event).trigger("release");
    

event:
  - platform: template
    name: '${device_button_1} Event'
    id: button_event

    # Optional variables:
    icon: "mdi:gesture-tap-button"
    event_types:
      - "click"
      - "double_click"
      - "hold"
      - "release"

select:
  - platform: template
    name: '${device_button_1} Operating Mode'
    id: operating_mode
    entity_category: config
    optimistic: true
    options:
      - Decoupled
      - Control Output
    restore_value: True
    initial_option: Control Output
    set_action: 
      then:
        - lambda: |-
            return;
