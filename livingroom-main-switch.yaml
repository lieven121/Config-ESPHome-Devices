substitutions:
  device_prefix: livingroom-main-switch
  device_name: "Livingroom Main Switch"
  device_description: "Sonoff mini R2 connected to living room fan and switches"
  device_ip: !secret livingroom_main_switch_ip
  device_ota: !secret livingroom_main_switch_ota
  device_key: !secret livingroom_main_switch_key

  device_button_1: "Button"

#region General Config
esphome:
  name: ${device_prefix}
  comment: "${device_description}"
  friendly_name: ${device_name}

logger:

api:
  encryption:
    key: ${device_key}

ota:
  - platform: esphome
    password: ${device_ota}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  manual_ip:
    static_ip: ${device_ip}
    gateway: 172.16.16.1
    subnet: 255.255.252.0
  ap:
    ssid: "${device_name} AP"
    password: ${device_ota}

captive_portal:
#endregion

#Device
esp8266:
  board: esp01_1m
  restore_from_flash: True

#IO
status_led:
  pin:
    number: GPIO13
    inverted: true

output:
  - platform: gpio
    id: relay_1
    pin: GPIO12

switch:
  - platform: output
    id: switch_1
    name: None
    output: relay_1

binary_sensor:
  - platform: gpio
    pin: GPIO00
    id: reset
    internal: true
    filters:
      - invert:
      - delayed_off: 10ms
    on_press:
      - switch.toggle: 
          id: switch_1
    
  - platform: gpio
    name: "${device_button_1} State"
    pin: 
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: True
    id: button_1_raw
    # internal: true

    filters:
      - delayed_on_off: 10ms
    on_multi_click:
      - timing:
          - ON for at most 350ms
          - OFF for at least 250ms
        then:
          - logger.log: "${device_button_1}: Click"
          - lambda: |-
              if(id(operating_mode).current_option() == std::string("Decoupled")) return;
              id(switch_1).toggle();
          - lambda: |-
              id(button_event).trigger("click");
      - timing:
          - ON for at most 350ms
          - OFF for at most 250ms
          - ON for at most 350ms
          - OFF for at least 250ms
        then:
          - lambda: |-
              id(button_event).trigger("double_click");
      - timing:
          - ON for at least 1s
        then:
          - lambda: |-
              id(button_event).trigger("hold");

    on_release:
      then:
        - lambda: |-
            id(button_event).trigger("release");

  # - platform: status
  #   disabled_by_default: True
  #   id: home_assistant_online
  #   name: "${prefix} Switch Connected"
  #   on_state: 
  #     then:
  #       - lambda: |-
  #           if(x) return;
  #           auto call = id(operating_mode).make_call();
  #           call.set_option("Control Output");
  #           call.perform();

event:
  - platform: template
    name: '${device_button_1} event'
    id: button_event
    # Optional variables:
    icon: "mdi:gesture-tap-button"
    event_types:
      - "click"
      - "double_click"
      - "hold"
      - "release"


select:
  - platform: template
    name: "${device_button_1} Operating Mode"
    id: operating_mode
    entity_category: config
    optimistic: true
    options:
      - Decoupled
      - Control Output
    restore_value: True
    initial_option: Control Output
    set_action: 
      then:
        - lambda: |-
            return;