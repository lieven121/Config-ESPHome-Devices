substitutions:
  device_prefix: kitchen-main-switch
  device_name: "Kitchen Main Switch"
  device_description: "ESP2866 d1 Mini"
  device_ip: !secret kitchen_main_switch_ip
  device_ota: !secret kitchen_main_switch_ota
  device_key: !secret kitchen_main_switch_key

  device_button_1: "Ceiling switch"
  device_button_2: "Button 2"
  device_state: "Motion"

#region General Config
esphome:
  name: ${device_prefix}
  comment: "${device_description}"
  friendly_name: ${device_name}

logger:

api:
  encryption:
    key: ${device_key}

ota:
  - platform: esphome
    password: ${device_ota}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  manual_ip:
    static_ip: ${device_ip}
    gateway: 172.16.16.1
    subnet: 255.255.252.0
  ap:
    ssid: "${device_name} AP"
    password: ${device_ota}

captive_portal:
#endregion

#Device
esp8266:
  board: d1_mini

#IO
binary_sensor:


  - platform: gpio
    name: "${device_button_1} State"
    device_class: motion
    pin: 
      number: D5
      mode: INPUT_PULLUP
      inverted: True
    id: raw_button_1
    # internal: true
    filters:
      - delayed_on_off: 10ms
    on_multi_click:
      - timing:
          - ON for at most 350ms
          - OFF for at least 250ms
        then:
          - logger.log: "${device_button_1}: Click"
          - lambda: |-
              id(button_1_event).trigger("click");
      - timing:
          - ON for at most 350ms
          - OFF for at most 250ms
          - ON for at most 350ms
          - OFF for at least 250ms
        then:
          - logger.log: "${device_button_1}: Double Click"
          - lambda: |-
              id(button_1_event).trigger("double_click");
      - timing:
          - ON for at least 1s
        then:
          - logger.log: "${device_button_1}: Hold"
          - lambda: |-
              id(button_1_event).trigger("hold");
    on_release:
        then:
          - logger.log: "${device_button_1}: Release"
          - lambda: |-
              id(button_1_event).trigger("release");
    
  - platform: gpio
    name: "${device_button_2} State"
    device_class: motion
    pin: 
      number: D7
      mode: INPUT_PULLUP
      inverted: True
    id: raw_button_2
    # internal: true
    filters:
      - delayed_on_off: 10ms
    on_multi_click:
      - timing:
          - ON for at most 350ms
          - OFF for at least 250ms
        then:
          - logger.log: "${device_button_2}: Click"
          - lambda: |-
              id(button_2_event).trigger("click");
      - timing:
          - ON for at most 350ms
          - OFF for at most 250ms
          - ON for at most 350ms
          - OFF for at least 250ms
        then:
          - logger.log: "${device_button_2}: Double Click"
          - lambda: |-
              id(button_2_event).trigger("double_click");
      - timing:
          - ON for at least 1s
        then:
          - logger.log: "${device_button_2}: Hold"
          - lambda: |-
              id(button_2_event).trigger("hold");
    on_release:
        then:
          - logger.log: "${device_button_2}: Release"
          - lambda: |-
              id(button_2_event).trigger("release");
  - platform: gpio
    name: "${device_state}"
    device_class: motion
    pin: 
      number: D6
      mode: INPUT
    id: raw_state
    filters:
      - delayed_on_off: 10ms

event:
  - platform: template
    name: '${device_button_1} Event'
    id: button_1_event

    # Optional variables:
    icon: "mdi:gesture-tap-button"
    event_types:
      - "click"
      - "double_click"
      - "hold"
      - "release"
  - platform: template
    name: '${device_button_2} Event'
    id: button_2_event

    icon: "mdi:gesture-tap-button"
    event_types:
      - "click"
      - "double_click"
      - "hold"
      - "release"

