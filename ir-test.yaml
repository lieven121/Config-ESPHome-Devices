substitutions:
    prefix: IRTest
    device_name: ir-test
    device_description: "Test Ir for gree"
esphome:
  name: ${device_name}
  comment: "${device_description}"

esp8266:
  board: nodemcu

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "cKc86jSxhC7E8QjiD0T2lmVo7ooS4eXS8vJMWznwAwU="

ota:
  - platform: esphome
    password: "IRTEST"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  manual_ip:
      static_ip: 172.16.16.11
      gateway: 172.16.16.1
      subnet: 255.255.252.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${device_name} Hotspot"
    password: "IRTEST123"

captive_portal:

remote_transmitter:
  pin: D0
  carrier_duty_percent: 50%

climate:
  - platform: heatpumpir        # adjust to match your AC unit!
    name: "Dining AC"
    min_temperature: 17
    max_temperature: 32
    protocol: greeyan
    horizontal_default: auto
    vertical_default: auto
