substitutions:
  device_prefix: basement-fan
  device_name: "Basement Fan"
  device_description: "Sonnof basic connected to a fan in the basement"
  device_ip: !secret basement_fan_ip
  device_ota: !secret basement_fan_ota
  device_key: !secret basement_fan_key

#region General Config
esphome:
  name: ${device_prefix}
  comment: "${device_description}"
  friendly_name: ${device_name}

logger:

api:
  encryption:
    key: ${device_key}

ota:
  - platform: esphome
    password: ${device_ota}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  manual_ip:
    static_ip: ${device_ip}
    gateway: 172.16.16.1
    subnet: 255.255.252.0
  ap:
    ssid: "${device_name} AP"
    password: ${device_ota}

captive_portal:
#endregion

#Device
esp8266:
  board: esp01_1m

#IO
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: True
    name: "Fan Manual Override"
    on_press:
      - switch.toggle: relay

switch:
  - platform: gpio
    name: None
    pin: GPIO12
    id: relay

status_led:
  pin:
    number: GPIO13
    inverted: yes