substitutions:
  device_prefix: hallway-entrance-light
  device_name: "Hallway Entrance Light"
  device_description:  "H801 Connected to the Entrance light"
  device_ip: !secret hallway_entrance_light_ip
  device_ota: !secret hallway_entrance_light_ota
  device_key: !secret hallway_entrance_light_key

#region General Config
esphome:
  name: ${device_prefix}
  comment: "${device_description}"
  friendly_name: ${device_name}

logger:

api:
  encryption:
    key: ${device_key}

ota:
  - platform: esphome
    password: ${device_ota}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  manual_ip:
    static_ip: ${device_ip}
    gateway: 172.16.16.1
    subnet: 255.255.252.0
  ap:
    ssid: "${device_name} AP"
    password: ${device_ota}

captive_portal:
#endregion

#Device
esp8266:
  board: esp01_1m

output:
  - platform: esp8266_pwm
    pin: 12
    frequency: 1000 Hz
    id: pwm_b
  - platform: esp8266_pwm
    pin: 13
    frequency: 1000 Hz
    id: pwm_g
  - platform: esp8266_pwm
    pin: 15
    frequency: 1000 Hz
    id: pwm_r
  - platform: esp8266_pwm
    pin: 14
    frequency: 1000 Hz
    id: pwm_w1
  - platform: esp8266_pwm
    pin: 4
    frequency: 1000 Hz
    id: pwm_w2

light:
  - platform: cwww
    id: entrance_light
    name: None
    cold_white: pwm_w1
    warm_white: pwm_w2
    cold_white_color_temperature: 6536 K
    warm_white_color_temperature: 2000 K
    constant_brightness: true

  - platform: rgb
    id: entrance_notification_light
    name: "Notification Light"
    red: pwm_r
    green: pwm_g
    blue: pwm_b
    effects:
      - lambda:
          name: Blink
          update_interval: 500ms
          lambda: |-
            static int state;
            if (initial_run) {
              state = 0;
            }
            auto call = id(entrance_notification_light).turn_on();

            if(state == 0) {
              call.set_brightness(1.0);
            call.set_transition_length(500);
            }
            else if(state == 1) {
              call.set_brightness(0);
              // Transition of 1000ms = 1s
              call.set_transition_length(500);
            }
            call.perform();
            state += 1;
            if (state == 2)
              state = 0;

      - lambda:
          name: Slow Blink
          update_interval: 500ms
          lambda: |-
            static int state;
            if (initial_run) {
              state = 0;
            }
            auto call = id(entrance_notification_light).turn_on();

            if(state == 0) {
              call.set_brightness(1.0);
              call.set_transition_length(500);
            }
            else if(state == 2) {
              call.set_brightness(0);
              // Transition of 1000ms = 1s
              call.set_transition_length(500);
            }
            call.perform();
            state += 1;
            if (state == 3)
              state = 0;

