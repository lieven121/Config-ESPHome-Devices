esphome:
  name: actuator
  friendly_name: Actuator

esp8266:
  board: nodemcu

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "zd4edx6iQvsog/FOW6TXgZ+v/JjOw/5IBG1M6549XrE="

ota:
  - platform: esphome
    password: "7554763ef6a8b847fc151296aed102bd"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  manual_ip:
    static_ip: !secret ip_actuator
    gateway: 172.16.16.1
    subnet: 255.255.252.0
  # use_address: 172.16.17.222

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Actuator Fallback Hotspot"
    password: "ApGIlZezlQJN"

captive_portal:


number:
  - platform: template
    name: "Template number"
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1

    set_action:
      then:
        - servo.write:
            id: my_servo
            level: !lambda 'return (x - 50) / 50.0;'

servo:
  - id: my_servo
    auto_detach_time:  1s
    output: pwm_output


# Example output platform
# On ESP32, use ledc output
output:
  - platform: esp8266_pwm
    id: pwm_output
    pin: D5
    frequency: 50 Hz