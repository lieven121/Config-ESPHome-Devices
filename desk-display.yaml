image:
  - file: "assets/fad/sun.svg"
    type: GRAYSCALE
    id: fad_sun
    resize: 24x24

# Define a PWM output on the ESP32
output:
  - platform: ledc
    pin: GPIO42
    id: backlight_pwm
    inverted: True
    #why does the display turn on to then dimm on again

# Define a monochromatic, dimmable light for the backlight
light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Backlight"
    id: back_light
    initial_state: 
      brightness: 100% 
    restore_mode: ALWAYS_ON

# color:
#   - id: red
#     red: 100%
#     green: 0%
#     blue: 0%
color:
  - id: bg_color
    hex: '000000'


sensor:
  - platform: homeassistant
    id: solar_production
    entity_id: sensor.solar_production
    on_value:
      - lvgl.label.update:
          id: lbl_solar_power
          text:
            format: "#FFEA00 %.1fW #"
            args: [ 'x' ]

  - platform: homeassistant
    id: home_power
    entity_id: sensor.home_power
    on_value:
      - lvgl.label.update:
          id: lbl_home_power
          text:
            format: "#FFFFFF %.1fW #"
            args: [ 'x' ]

  - platform: homeassistant
    id: grid_power_consumed
    entity_id: sensor.power_consumed
    on_value:
      - if:
          condition:
            lambda: 'return x >= 0.001;'
          then:
          - lvgl.label.update:
              id: lbl_grid_power
              text:
                format: "#488FC2 %.3fkW #"
                args: [ 'x' ]

  - platform: homeassistant
    id: grid_power_produced
    entity_id: sensor.power_produced
    on_value:
      - if:
          condition:
            lambda: 'return x >= 0.001;'
          then:
            - lvgl.label.update:
                id: lbl_grid_power
                text:
                  format: "#A280C4 %.3fkW #"
                  args: [ 'x' ]

  - platform: homeassistant
    id: grid_car_power
    entity_id: sensor.smappee_power
    on_value:
      - lvgl.label.update:
          id: lbl_ev_power
          text:
            format: "#FFFFFF %.1fW #"
            args: [ 'x' ]

  - platform: homeassistant
    id: grid_battery_power
    entity_id: sensor.sonnenbatterie_213526_state_battery_inout
    on_value:
      - if:
          condition:
            lambda: 'return x > 0;'
          then:
            - lvgl.label.update:
                id: lbl_battery_power
                text:
                  format: "#4db6ac %.1fW #"
                  args: [ 'x' ]
          else:
            #set x to abs
            - lambda: 'x = abs(x);'
            - lvgl.label.update:
                id: lbl_battery_power
                text:
                  format: "#f06284 %.1fW #"
                  args: [ 'x' ]
  
  - platform: homeassistant
    id: grid_battery_pct
    entity_id: sensor.sonnenbatterie_213526_state_charge_user
    on_value:
      - lvgl.label.update:
          id: lbl_battery_pct
          text:
            format: "#FFFFFF %.0f%% #"
            args: [ 'x' ]

  - platform: homeassistant
    id: car_xc40_pct
    entity_id: sensor.volvo_xc40_battery
    on_value:
      - lvgl.label.update:
          id: lbl_xc40_battery_pct
          text:
            format: "#FFFFFF %.0f%% #"
            args: [ 'x' ]

  - platform: homeassistant
    id: car_twingo_pct
    entity_id: sensor.twingo_battery_level
    on_value:
      - lvgl.label.update:
          id: lbl_twingo_battery_pct
          text:
            format: "#FFFFFF %.0f%% #"
            args: [ 'x' ]

  
      # - if:
      #     condition:
      #       lambda: 'return x > 0;'
      #     then:
      #       - lvgl.label.update:
      #           id: lbl_battery_power
      #           text:
      #             format: "#4db6ac %.1fW #"
      #             args: [ 'x' ]
      #     else:
      #       - lvgl.label.update:
      #           id: lbl_battery_power
      #           text:
      #             format: "#f06284 %.1fW #"
      #             args: [ 'x' ]


    # on_value:
