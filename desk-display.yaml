substitutions:
  device_prefix: desk-display
  device_name: "Desk Display"
  device_description: "An display to show a home assistant ui"
  device_ip: !secret desk_display_ip
  device_ota: !secret desk_display_ota
  device_key: !secret desk_display_key

#region General Config
esphome:
  name: ${device_prefix}
  comment: "${device_description}"
  friendly_name: ${device_name}
  on_boot:
    priority: 600
    then:
      - lvgl.page.show: home
  #     - script.execute: draw_display

logger:

api:
  encryption:
    key: ${device_key}
#   on_client_connected:
    # - script.execute: draw_display
#   on_client_disconnected:
    # - script.execute: draw_display

ota:
  - platform: esphome
    password: ${device_ota}
    # on_begin:
    #   then:
    #     - logger.log: "OTA start a"
    #     - lvgl.widget.hide: root
    #     - lvgl.widget.show: popup_obj
    #     - lvgl.resume:
    #     - lvgl.widget.redraw:
    #     - logger.log: "OTA start b"
    # on_progress:
    #   then:
    #     - lvgl.bar.update:
    #         id: lv_bar
    #         value: !lambda "return (int)x;"
    #     - lambda: "id(lv_id).loop();"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  manual_ip:
    static_ip: ${device_ip}
    gateway: 172.16.16.1
    subnet: 255.255.252.0
  ap:
    ssid: "${device_name} AP"
    password: ${device_ota}

captive_portal:
#endregion

#Device
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB  #try 32MB if this works
  framework:
    type: esp-idf
    version: recommended

#IO
button:
  - platform: factory_reset
    id: factory_reset_btn
    internal: true

i2c:
  sda: 11
  scl: 7
  scan: true
  id: bus_a

touchscreen:
  - platform: cst816
    i2c_id: bus_a
    interrupt_pin: GPIO12
    reset_pin: GPIO06
    id: my_touchscreen
    on_touch:
      - logger.log:
          format: "Touch at (%d, %d)"
          args: [touch.x, touch.y]

