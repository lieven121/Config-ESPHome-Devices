display:
  - platform: ili9xxx
    id: lcd
    model: st7789v
    dimensions:
      height: 240
      width: 240
      offset_height: 0
      offset_width: 0
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    color_order: bgr
    invert_colors: true
    data_rate: 80MHz
    cs_pin: GPIO05
    dc_pin: GPIO47
    reset_pin: GPIO14
    auto_clear_enabled: false
    update_interval: never
    # lambda: |-
