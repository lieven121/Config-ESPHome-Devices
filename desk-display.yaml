    #         args: [ 'x' ]

binary_sensor:
  - platform: homeassistant
    id: car_charger
    entity_id: input_boolean.smappee_charge
    on_state:
      - lvgl.widget.update:
          id: ev_switch
          state:
            checked: !lambda return x;

