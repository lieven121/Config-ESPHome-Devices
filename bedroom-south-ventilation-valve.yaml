substitutions:
  device_prefix: bedroom-south-air-valve
  device_name: "Bedroom South Air Valve"
  device_description: "ESP8266 d1 Mini Connected to a stepper motor for controlling the air supply"
  device_ip: !secret bedroom_south_air_valve_ip
  device_ota: !secret bedroom_south_air_valve_ota
  device_key: !secret bedroom_south_air_valve_key

  stepper_max_position: "1900"

#region General Config
esphome:
  name: ${device_prefix}
  comment: "${device_description}"
  friendly_name: ${device_name}
  on_boot:
    priority: -100
    then:
      - stepper.set_target:
          id: my_stepper
          target: !lambda "return (int)(id(cover_position) * ${stepper_max_position} / 100.0);"

logger:

api:
  encryption:
    key: ${device_key}

ota:
  - platform: esphome
    password: ${device_ota}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  manual_ip:
    static_ip: ${device_ip}
    gateway: 172.16.16.1
    subnet: 255.255.252.0
  ap:
    ssid: "${device_name} AP"
    password: ${device_ota}

captive_portal:
#endregion

#region Device
esp8266:
  board: d1_mini

stepper:
  - platform: a4988
    id: my_stepper
    step_pin: D2
    dir_pin: D1
    max_speed: 800 steps/s
    sleep_pin:
      number: D5
      inverted: false
    acceleration: 1600 steps/s^2
    deceleration: 1600 steps/s^2

globals:
  - id: cover_position
    type: float
    restore_value: true
    initial_value: "0.0"

# Continuously syncs stepper position → cover while moving
# interval:
#   - interval: 200ms
#     then:
#       - lambda: |-
#           float pos = (float)id(my_stepper).current_position / ${stepper_max_position};
#           id(cover_position) = pos * 100.0f;
#           auto call = id(air_supply_valve).make_call();
#           call.set_position(pos);
#           call.perform();

cover:
  - platform: template
    name: "Air Supply Valve"
    id: air_supply_valve
    device_class: damper
    has_position: true
    optimistic: false

    open_action:
      - stepper.set_target:
          id: my_stepper
          target: ${stepper_max_position}
      - globals.set:
          id: cover_position
          value: "100.0"
      - cover.template.publish:
          id: air_supply_valve
          state: OPEN
          current_operation: IDLE

    close_action:
      - stepper.set_target:
          id: my_stepper
          target: 0
      - globals.set:
          id: cover_position
          value: "0.0"
      - cover.template.publish:
          id: air_supply_valve
          state: CLOSED
          current_operation: IDLE

    position_action:
      - stepper.set_target:
          id: my_stepper
          target: !lambda "return (int)(pos * ${stepper_max_position});"
      - globals.set:
          id: cover_position
          value: !lambda "return pos * 100.0;"
      - cover.template.publish:
          id: air_supply_valve
          position: !lambda "return pos;"
          current_operation: IDLE

    stop_action:
      - lambda: |-
          id(my_stepper).set_target(id(my_stepper).current_position);
          float pos = (float)id(my_stepper).current_position / ${stepper_max_position};
          id(cover_position) = pos * 100.0f;
      - cover.template.publish:
          id: air_supply_valve
          position: !lambda "return (float)id(my_stepper).current_position / ${stepper_max_position};"
          current_operation: IDLE

    lambda: |-
      float pos = (float)id(my_stepper).current_position / ${stepper_max_position};
      id(cover_position) = pos * 100.0f;
      if (pos <= 0.0f) return COVER_CLOSED;
      if (pos >= 1.0f) return COVER_OPEN;
      return pos;
#endregion