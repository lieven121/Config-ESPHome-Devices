substitutions:
  prefix: bathroom-mirror
  device_name: "bathroom-mirror-light"
  device_description: "H801 Connected to the Bathroom mirror light"

esphome:
  name: ${device_name}
  comment: "${device_description}"

esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "FW/5Dew+z07bD+kGPHXcUVHI1e+waFTaOisN0rbGZMo="

ota:
  - platform: esphome
    password: "TxW@BSASds$5V%sKqaqN&avt@!q2Fu*9FLy9kro7yz"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  manual_ip:
    static_ip: !secret ip_bathroom_mirror_light
    gateway: 172.16.16.1
    subnet: 255.255.252.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Bathroom-Mirror-Light"
    password: "nLmXOUcborby"

captive_portal:


output:
  - platform: esp8266_pwm
    pin: 12
    frequency: 1000 Hz
    id: pwm_b
  - platform: esp8266_pwm
    pin: 13
    frequency: 1000 Hz
    id: pwm_g
  - platform: esp8266_pwm
    pin: 15
    frequency: 1000 Hz
    id: pwm_r
  - platform: esp8266_pwm
    pin: 14
    frequency: 1000 Hz
    id: pwm_w1
  - platform: esp8266_pwm
    pin: 4
    frequency: 1000 Hz
    id: pwm_w2

light:
  - platform: cwww
    id: mirror_light
    name: "Mirror Light"
    cold_white: pwm_w1
    warm_white: pwm_w2
    cold_white_color_temperature: 6536 K
    warm_white_color_temperature: 2000 K
    constant_brightness: true
    gamma_correct: 1
