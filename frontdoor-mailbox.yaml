substitutions:
  device_prefix: mailbox
  device_name: "Mailbox"
  device_description: ""
  device_ip: !secret frontdoor_mailbox_ip
  device_ota: !secret frontdoor_mailbox_ota
  device_key: !secret frontdoor_mailbox_key

#region General Config
esphome:
  name: ${device_prefix}
  comment: "${device_description}"
  friendly_name: ${device_name}

logger:

api:
  encryption:
    key: ${device_key}

ota:
  - platform: esphome
    password: ${device_ota}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  manual_ip:
    static_ip: ${device_ip}
    gateway: 172.16.16.1
    subnet: 255.255.252.0
  ap:
    ssid: "${device_name} AP"
    password: ${device_ota}

captive_portal:
#endregion

#Device
esp8266:
  board: nodemcuv2
  restore_from_flash: True

#IO
uart:
    tx_pin: GPIO1
    rx_pin: GPIO3
    baud_rate: 256000
    parity: NONE
    stop_bits: 1

ld2410:


switch:
  - platform: gpio
    pin: D0
    restore_mode: ALWAYS_ON
    device_class: outlet
    name: "Tablet charger"
  - platform: template
    optimistic: True
    restore_mode: RESTORE_DEFAULT_OFF
    name: "Auto Reset Mail"
    entity_category: config
    id: auto_reset

binary_sensor:
  - platform: gpio
    name: "Reed Contact 1"
    pin: 
      number: D5
      mode: INPUT_PULLUP
      inverted: true
    filters: 
      delayed_on_off: 200ms
    on_state: 
      then:
        - lambda: 
            if(!x)
              id(new_mail).publish_state(true);
        
  - platform: gpio
    name: "Reed Contact 2"
    pin: 
      number: D6
      mode: INPUT_PULLUP
      inverted: true
    filters: 
      delayed_on_off: 200ms
    on_state:
      then: 
        - lambda: 
            if(x and id(auto_reset).state == false) return;
            id(new_mail).publish_state(false);


  - platform: gpio
    name: "Reed Contact 3"
    pin: 
      number: D7
      mode: INPUT_PULLUP
      inverted: true
    filters: 
      delayed_on_off: 200ms
    
  - platform: template
    name: "New Mail"
    id: new_mail

  - platform: ld2410
    has_target:
      name: Presence
    has_moving_target:
      name: Moving Target
    has_still_target:
      name: Still Target
    out_pin_presence_status:
      name: out pin presence status
      

number:
  - platform: ld2410
    timeout: 
      name: timeout
    max_move_distance_gate:
      name: max move distance gate
    max_still_distance_gate:
      name: max still distance gate

button:
  - platform: template
    name: "Reset Mail"
    on_press:
      - lambda: 
          id(new_mail).publish_state(false);
          
