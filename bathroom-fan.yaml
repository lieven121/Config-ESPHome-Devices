substitutions:
  device_prefix: bathroom-fan-light
  device_name: "Bathroom Fan"
  device_description: "Custom controller that can control the bathroom fan and lights"
  device_ip: !secret bathroom_fan_light_ip
  device_ota: !secret bathroom_fan_light_ota
  device_key: !secret bathroom_fan_light_key

#region General Config
esphome:
  name: ${device_prefix}
  comment: "${device_description}"
  friendly_name: ${device_name}

logger:

api:
  encryption:
    key: ${device_key}

ota:
  - platform: esphome
    password: ${device_ota}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  manual_ip:
    static_ip: ${device_ip}
    gateway: 172.16.16.1
    subnet: 255.255.252.0
  ap:
    ssid: "${device_name} AP"
    password: ${device_ota}

captive_portal:
#endregion

#Device
esp8266:
  board: nodemcu

#IO
output:
  - platform: esp8266_pwm
    pin: D2
    frequency: 1000 Hz
    id: pwm_r
    max_power: 0.9
  - platform: esp8266_pwm
    pin: D1
    frequency: 1000 Hz
    id: pwm_g
    max_power: 0.9
  - platform: esp8266_pwm
    pin: D7
    frequency: 1000 Hz
    id: pwm_b
    max_power: 0.9
  - platform: esp8266_pwm
    pin: D5
    frequency: 1000 Hz
    id: pwm_cw
    max_power: 0.9
  - platform: esp8266_pwm
    pin: D6
    frequency: 1000 Hz
    id: pwm_ww
    max_power: 0.9

switch:
  - platform: gpio
    name: None
    pin:
      number: D0
      inverted: true
    id: relay_1

light:
- platform: cwww
  id: toilet_light
  name: "Toilet Light"
  cold_white: pwm_cw
  warm_white: pwm_ww
  cold_white_color_temperature: 6536 K
  warm_white_color_temperature: 2000 K
  constant_brightness: true
  gamma_correct: 1
  effects:
    - lambda:
          name: Slow Blink
          update_interval: 750ms
          lambda: |-
            static int state;
            if (initial_run) {
              state = 0;
            }
            auto call = id(toilet_light).turn_on();

            if(state == 0) {
              call.set_brightness(1.0);
              call.set_transition_length(750);
            }
            else if(state == 2) {
              call.set_brightness(0);
              // Transition of 1000ms = 1s
              call.set_transition_length(750);
            }
            call.perform();
            state += 1;
            if (state == 3)
              state = 0;
    - lambda:
          name: Breathing
          update_interval: 1000ms
          lambda: |-
            static int state;
            if (initial_run) {
              state = 0;
            }
            auto call = id(toilet_light).turn_on();

            if(state == 0) {
              call.set_brightness(0.8);
              call.set_transition_length(1000);
            }
            else if(state == 2) {
              call.set_brightness(0.2);
              // Transition of 1000ms = 1s
              call.set_transition_length(1000);
            }
            call.perform();
            state += 1;
            if (state == 3)
              state = 0;

