i2c:
  sda: D4
  scl: D3
  scan: true
  id: bus_a

sensor:
  - platform: bme280_i2c
    temperature:
      name: "Bathroom Temperature"
      oversampling: 16x
    pressure:
      name: "Bathroom Pressure"
    humidity:
      name: "Bathroom Humidity"
    address: 0x77
    update_interval: 30s