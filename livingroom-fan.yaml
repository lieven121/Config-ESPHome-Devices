#https://gist.github.com/dennismaxjung/48325e3171b7f9e277fc8b062f7d8955

substitutions:
  device_prefix: livingroom-fan
  device_name: "Livingroom Fan"
  device_description: "Tuya MCU connected to the livingroom ceiling fan and light"
  device_ip: !secret livingroom_fan_ip
  device_ota: !secret livingroom_fan_ota
  device_key: !secret livingroom_fan_key

#region General Config
esphome:
  name: ${device_prefix}
  comment: "${device_description}"
  friendly_name: ${device_name}

logger:

api:
  encryption:
    key: ${device_key}

ota:
  - platform: esphome
    password: ${device_ota}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  manual_ip:
    static_ip: ${device_ip}
    gateway: 172.16.16.1
    subnet: 255.255.252.0
  ap:
    ssid: "${device_name} AP"
    password: ${device_ota}

captive_portal:
#endregion

#Device
esp8266:
  board: esp12e

#IO
time:
  - platform: homeassistant
    id: homeassistant_time

# external_components:
#   - source:
#       type: git
#       url: https://github.com/dennismaxjung/esphome
#       ref: release
#     components: [ tuya ]

uart:
  rx_pin: GPIO3
  tx_pin: GPIO5
  baud_rate: 9600

# Register the Tuya MCU connection
tuya:
  time_id: homeassistant_time


fan:
  - platform: "tuya"
    id: fan_01
    name: None
    switch_datapoint: 60
    speed_datapoint: 62
    direction_datapoint: 63
    speed_count: 6
    restore_mode: ALWAYS_OFF

# Create a light using the dimmer
light:
  - platform: "tuya"
    id: light_01
    name: "Main Light"
    switch_datapoint: 20
    warm_white_color_temperature: 300 mireds #500 mireds
    cold_white_color_temperature: 299 mireds #152 mireds
    color_temperature_datapoint: 23
    color_temperature_max_value: 1000.0
    color_temperature_invert: false
    max_value: 750
    dimmer_datapoint: 22
    restore_mode: ALWAYS_OFF