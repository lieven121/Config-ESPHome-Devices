substitutions:
  prefix: Doorbel
  device_name: doorbell
  device_description: "Shelly 1 connected to the doorbell and ringer"

esphome:
  name: ${device_name}
  comment: "${device_description}"
  on_boot:
    priority: 600
    then: 
      lambda: |-
        id(doorbell_ringer).turn_off();
        id(button_1).publish_state("");

      # id(my_ota).set_auth_password("HisKmq6Tkb5WZiMWc7iDLyysoUdnsuiesFW2j6WmUh");

esp8266:
  board: esp01_1m
  restore_from_flash: True

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "2bKVvcxHEKZ2BwgoDYIbPbtV5HWOLmDq12CcEqQyXlI="

ota:
  - platform: esphome
    password: "HisKmq6Tkb5WZiMWc7iDLyysoUdnsuiesFW2j6WmUh"
  # password: "empty-device-flashme"
  # id: my_ota


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  manual_ip:
    static_ip: !secret ip_entrance_doorbell
    gateway: 172.16.16.1
    subnet: 255.255.252.0
  # use_address: 172.16.17.222

  

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${prefix} Fallback Hotspot"
    password: "HXmsApndTWUdW9SigvuKBvvHSDbsj"

captive_portal:
    
    
output:
  - platform: gpio
    id: doorbell_ringer
    pin: GPIO4


button:
  - platform: template
    name: Press Doorbell
    id: software_doorbell_press

    # Optional variables:
    icon: "mdi:doorbell"
    on_press:
      then:
        - output.turn_on: doorbell_ringer
        - delay: 60ms
        - output.turn_off: doorbell_ringer

binary_sensor:
    
  - platform: gpio
    name: "${prefix} Button State"
    pin: 
      number: GPIO5
    id: doorbell_button_raw
    # internal: true
    filters:
      # - delayed_on_off: 50ms
      - delayed_on: 80ms
    
    on_press:
      then:
          - lambda: |-
              if(id(operating_mode_button).state == "Decoupled") return;
              id(software_doorbell_press).press();
          - text_sensor.template.publish:
              id: button_1
              state: !lambda 'return "click";'


    on_multi_click:
      # - timing:
      #     - ON for 20ms to 400ms
      #     #- OFF for at least 300ms
      #   then:
      #     # - lambda: |-
      #     #     if(id(operating_mode_button).state == "Decoupled") return;
      #     #     id(software_doorbell_press).press();
      #     - text_sensor.template.publish:
      #         id: button_1
      #         state: !lambda 'return "click";'
      - timing:
          - ON for 20ms to 400ms
          - OFF for 20ms to 400ms
          - ON for 20ms to 400ms
          - OFF for at least 400ms
        then:
          # - lambda: |-
          #     if(id(operating_mode_button).state == "Decoupled") return;
          #     id(software_doorbell_press).press();
          - text_sensor.template.publish:
              id: button_1
              state: !lambda 'return "double_click";'
      - timing:
          - ON for at least 500ms
        then:
          # - lambda: |-
          #     if(id(operating_mode_button).state == "Decoupled") return;
          #     id(software_doorbell_press).press();
          - text_sensor.template.publish:
              id: button_1
              state: !lambda 'return "hold";'
    on_release:
      then:
        - lambda: |-
            id(button_1).publish_state("release");

  
  - platform: status
    disabled_by_default: True
    id: home_assistant_online
    name: "${prefix} Switch Connected"
    on_state: 
      then:
        - lambda: |-
            if(x) return;
            auto call1 = id(operating_mode_button).make_call();
            call1.set_option("Control Bell");
            call1.perform();



text_sensor:
  - platform: template
    name: '${prefix} Button action'
    id: button_1
    on_value: # When a state is set
      then:
        - if:
            condition:
              text_sensor.state:
                id: button_1
                state: ''
            else: # If non-empty
              - delay: 100ms
              - text_sensor.template.publish:
                  id: button_1
                  state: !lambda 'return "";' # Reset to empty

select:
  - platform: template
    name: "${prefix} Pysical Button Operating Mode"
    id: operating_mode_button
    entity_category: config
    optimistic: true
    options:
      - Decoupled
      - Control Bell
    restore_value: True
    initial_option: Control Bell
    set_action: 
      then:
        - lambda: |-
            return;

