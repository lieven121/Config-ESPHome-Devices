substitutions:
  prefix: Test R4
  device_name: test-r4
  device_description: "Sonoff mini extreme (R4) connected to ..."

esphome:
  name: ${device_name}
  comment: "${device_description}"
  on_boot:
    priority: 600
    then: 
      lambda: |-
        id(button_1).publish_state("");


esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "aO7vhLp8fwc3ZIMS5jUvyFbJupXOn+b3TJwlDJsqIew="

ota:
  - platform: esphome
    password: "db3136602d8d6b6b57ae5303aa308782"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: True
  use_address: 172.16.18.5

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Test-R4-Blank Fallback Hotspot"
    password: "nciE9qqqu373"


captive_portal:
    
status_led:
  pin:
    number: GPIO19
    inverted: true

output:
  - platform: gpio
    id: relay_1
    pin: GPIO26

light:
  - platform: binary
    id: light_1
    name: ${prefix} Main Light
    output: relay_1    

binary_sensor:
  - platform: gpio
    pin: GPIO00
    id: reset
    internal: true
    filters:
      - invert:
      - delayed_off: 10ms
    on_press:
      - light.toggle: 
          id: light_1
    
  - platform: gpio
    name: "${prefix} Button 1 State"
    pin: 
      number: GPIO27
      mode: INPUT_PULLUP
      inverted: True
    # on_press:
    # - light.toggle: cupboard_light_sink
    # - light.toggle: cupboard_light_cooktop
    # device_class: motion
    id: button_1_raw
    # internal: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_multi_click:
      - timing:
          - ON for 20ms to 400ms
          - OFF for at least 300ms
        then:
          - lambda: |-
              if(id(operating_mode).current_option() == std::string("Decoupled")) return;
              auto call = id(light_1).toggle();
              call.perform();
          - text_sensor.template.publish:
              id: button_1
              state: !lambda 'return "click";'
      - timing:
          - ON for 20ms to 400ms
          - OFF for 20ms to 400ms
          - ON for 20ms to 400ms
          - OFF for at least 400ms
        then:
          - text_sensor.template.publish:
              id: button_1
              state: !lambda 'return "double_click";'
      - timing:
          - ON for at least 500ms
        then:
          - text_sensor.template.publish:
              id: button_1
              state: !lambda 'return "hold";'
    on_release:
      then:
        - lambda: |-
            id(button_1).publish_state("release");

  - platform: status
    disabled_by_default: True
    id: home_assistant_online
    name: "${prefix} Switch Connected"
    on_state: 
      then:
        - lambda: |-
            if(x) return;
            auto call = id(operating_mode).make_call();
            call.set_option("Control Output");
            call.perform();
            

# globals:
#     # 0: decoupled
#     # 1: toggle_relay
#    - id: operating_mode
#      type: int
#      restore_value: yes
#      initial_value: '1'

text_sensor:
  - platform: template
    name: '${prefix} Button 1 action'
    id: button_1
    on_value: # When a state is set
      then:
        - if:
            condition:
              text_sensor.state:
                id: button_1
                state: ''
            else: # If non-empty
              - delay: 100ms
              - text_sensor.template.publish:
                  id: button_1
                  state: !lambda 'return "";' # Reset to empty

select:
  - platform: template
    name: "${prefix} Operating Mode"
    id: operating_mode
    entity_category: config
    optimistic: true
    options:
      - Decoupled
      - Control Output
    restore_value: True
    initial_option: Control Output
    set_action: 
      then:
        - lambda: |-
            return;










