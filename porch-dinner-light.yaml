substitutions:
  device_prefix: porch-dinner-light
  device_name: "Porch Dinner Light"
  device_description:  "Shelly RGBW2 connected to button and light in the porch on the dinner table side"
  device_ip: !secret porch_dinner_light_ip
  device_ota: !secret porch_dinner_light_ota
  device_key: !secret porch_dinner_light_key

  device_button_1: "Button"


#region General Config
esphome:
  name: ${device_prefix}
  comment: "${device_description}"
  friendly_name: ${device_name}

logger:

api:
  encryption:
    key: ${device_key}

ota:
  - platform: esphome
    password: ${device_ota}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  manual_ip:
    static_ip: ${device_ip}
    gateway: 172.16.16.1
    subnet: 255.255.252.0
  ap:
    ssid: "${device_name} AP"
    password: ${device_ota}

captive_portal:
#endregion

#Device
esp8266:
  board: esp01_1m

#IO
status_led:
  pin: GPIO2
  
light:
  - platform: monochromatic
    restore_mode: ALWAYS_OFF
    name: None
    output: ch_w
    id: light_1
    gamma_correct: 1

# Example output entry
output:
  - platform: esp8266_pwm
    id: ch_r
    pin: GPIO12
    frequency: 244 Hz
  - platform: esp8266_pwm
    id: ch_g
    pin: GPIO15
    frequency: 244 Hz
  - platform: esp8266_pwm
    id: ch_b
    pin: GPIO14
    frequency: 244 Hz
  - platform: esp8266_pwm
    id: ch_w
    pin: GPIO4
    frequency: 244 Hz
    # min_power: 0.01
    max_power: 0.90
    zero_means_zero: true

binary_sensor:    
  - platform: gpio
    name: "${device_button_1} State"
    pin: 
        number: GPIO5
    id: button_1_raw
    filters:
      - delayed_on_off: 10ms
    on_multi_click:
      - timing:
          - ON for at most 350ms
          - OFF for at least 250ms
        then:
          - logger.log: "${device_button_1}: Click"
          - lambda: |-
              if(id(operating_mode_1).current_option() == std::string("Decoupled")) return;
              auto call = id(light_1).toggle();
              call.perform();
          - lambda: |-
              id(button_event).trigger("click");
      - timing:
          - ON for at most 350ms
          - OFF for at most 250ms
          - ON for at most 350ms
          - OFF for at least 250ms
        then:
          - logger.log: "${device_button_1}: Double Click"
          - lambda: |-
              id(button_event).trigger("double_click");
      - timing:
          - ON for at least 1s
        then:
          - logger.log: "${device_button_1}: Hold"
          - lambda: |-
              id(button_event).trigger("hold");
    on_release:
        then:
          - logger.log: "${device_button_1}: Release"
          - lambda: |-
              id(button_event).trigger("release");
    
  
sensor:
  - platform: adc
    pin: A0
    name: "${device_name} ADC"
    update_interval: 5s
    accuracy_decimals: 4
    id: current_raw
    internal: true
  - platform: template
    name: "${device_name} Power"
    unit_of_measurement: W
    accuracy_decimals: 1
    device_class: power
    lambda: return id(current_raw).state;
    filters:
      - calibrate_linear:
        - 0.4000 -> 0.0
        - 0.4043 -> 0.14
        - 0.4053 -> 0.20
      - multiply: 12 # 12V lamp
      
event:
  - platform: template
    name: '${device_button_1} Event'
    id: button_event

    # Optional variables:
    icon: "mdi:gesture-tap-button"
    event_types:
      - "click"
      - "double_click"
      - "hold"
      - "release"

select:
  - platform: template
    name: "${device_button_1} Operating Mode"
    id: operating_mode_1
    entity_category: config
    optimistic: true
    options:
      - Decoupled
      - Control Output
    restore_value: True
    initial_option: Control Output
    set_action: 
      then:
        - lambda: |-
            return;