    ssid: "Porch-HP Fallback Hotspot"
    password: "GuhBydkolrw"

captive_portal:
    
status_led:
  pin:
    number: GPIO13
    inverted: true

output:
  - platform: gpio
    id: relay_1
    pin: GPIO12

light:
  - platform: binary
    id: light_1
    name: ${prefix} Heatpump
    output: relay_1    

binary_sensor:
  - platform: gpio
    pin: GPIO00
    id: reset
    internal: true
    filters:
      - invert:
      - delayed_off: 10ms
    on_press:
      - light.toggle: 
          id: light_1
    
  - platform: gpio
    name: "${prefix} Button 1 State"
    pin: 
      number: GPIO4
      mode: INPUT_PULLUP
