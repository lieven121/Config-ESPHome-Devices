text_sensor:
  - platform: template
    name: '${prefix} Button 1 action'
    id: button_1
    on_value: # When a state is set
      then:
        - if:
            condition:
              text_sensor.state:
                id: button_1
                state: ''
            else: # If non-empty
              - delay: 100ms
              - text_sensor.template.publish:
                  id: button_1
                  state: !lambda 'return "";' # Reset to empty

select:
  - platform: template
    name: "${prefix} Operating Mode"
    id: operating_mode
    entity_category: config
    optimistic: true
    options:
      - Decoupled
      - Control Output
    restore_value: True
    initial_option: Control Output
    set_action: 
      then:
        - lambda: |-
            return;










