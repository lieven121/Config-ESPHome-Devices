substitutions:
  prefix: Porch
  device_name: porch-heatpump
  device_description: "Sonoff mini R2 connected to heatpump in porch"

esphome:
  name: ${device_name}
  comment: "${device_description}"
  on_boot:
    priority: 600
    then: 
      lambda: |-
        id(button_1).publish_state("");


esp8266:
  board: esp01_1m
  restore_from_flash: True

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "Luab7uxE6PjCSSBnj6kGYqbUBzIOXBHZHq3JouM/r+M="

ota:
  - platform: esphome
    password: "f1cf82835e5b42f2955163fcc5e81af5"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  manual_ip:
    static_ip: !secret ip_porch_heatpump
    gateway: 172.16.16.1
    subnet: 255.255.252.0
  # use_address: 172.16.18.3
  # use_address: 172.16.16.40
  

  # Enable fallback hotspot (captive portal) in case wifi connection fails
